{% extends "base.html" %}

{% block content %}
<div class="hero-section bg-home">
    <div class="container">
        <div class="hero-content">
            <h1 class="hero-title">
                <i class="fas fa-leaf"></i> Naturalize
            </h1>
            <p class="hero-subtitle">
                AI-Powered Personalized Skin & Hair Care Recommendations
            </p>
            <div class="mt-4">
                {% if current_user.is_authenticated %}
                    <a href="{{ url_for('dashboard') }}" class="btn btn-primary btn-lg me-3">
                        <i class="fas fa-tachometer-alt"></i> Go to Dashboard
                    </a>
                {% else %}
                    <a href="{{ url_for('signup') }}" class="btn btn-primary btn-lg me-3">
                        <i class="fas fa-user-plus"></i> Get Started
                    </a>
                    <a href="{{ url_for('login') }}" class="btn btn-secondary btn-lg">
                        <i class="fas fa-sign-in-alt"></i> Login
                    </a>
                {% endif %}
            </div>
        </div>
    </div>
</div>
{% endblock %}
