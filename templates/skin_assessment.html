{% extends "base.html" %}

{% block content %}
<div class="form-container bg-skin">
    <div class="form-glass">
        <h2><i class="fas fa-smile"></i> Skin Assessment</h2>
        <p class="text-center mb-4">Let's understand your skin better</p>
        
        <form method="POST" id="skinForm">
            <div class="mb-3">
                <label for="age" class="form-label">Age</label>
                <input type="number" class="form-control" id="age" name="age" required min="0" max="120">
                <small class="text-white-50">Enter your age for age-appropriate recommendations</small>
            </div>
            
            <div class="mb-3">
                <label for="skin_type" class="form-label">Skin Type</label>
                <select class="form-control" id="skin_type" name="skin_type" required>
                    <option value="">Select your skin type</option>
                    <option value="Oily">Oily - Shiny, prone to breakouts</option>
                    <option value="Dry">Dry - Tight, flaky, rough texture</option>
                    <option value="Combination">Combination - Oily in T-zone, dry elsewhere</option>
                    <option value="Sensitive">Sensitive - Easily irritated, red, reactive</option>
                </select>
            </div>
            
            <div class="mb-3">
                <label for="skin_tone" class="form-label">Skin Tone</label>
                <select class="form-control" id="skin_tone" name="skin_tone" required>
                    <option value="">Select your skin tone</option>
                    <option value="Fair">Fair</option>
                    <option value="Light">Light</option>
                    <option value="Medium">Medium</option>
                    <option value="Tan">Tan</option>
                    <option value="Dark">Dark</option>
                </select>
            </div>
            
            <div class="mb-3">
                <label for="concerns" class="form-label">Skin Concerns</label>
                <textarea class="form-control" id="concerns" name="concerns" rows="4" 
                          placeholder="e.g., Acne, aging, hyperpigmentation, dryness, oiliness, sensitivity" 
                          required></textarea>
                <small class="text-white-50">List your main skin concerns (separate with commas)</small>
            </div>
            
            <button type="submit" class="btn btn-primary w-100">
                <i class="fas fa-robot"></i> Get Personalized Recommendations
            </button>
        </form>
    </div>
</div>

<div id="loadingSpinner" class="spinner-overlay">
    <div class="spinner">
        <i class="fas fa-spinner fa-3x"></i>
        <p class="mt-3">Analyzing your skin profile...</p>
    </div>
</div>

<script>
document.getElementById('skinForm').addEventListener('submit', function() {
    document.getElementById('loadingSpinner').style.display = 'flex';
});
</script>
{% endblock %}
